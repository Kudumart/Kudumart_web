[build]
  publish = "dist"
  command = "npm run build"

[[edge_functions]]
  path = "/product/*"
  function = "product-seo"

[[redirects]]
  from = "/see-all"
  to = "/catalog"
  status = 301
  force = true

[[redirects]]
  from = "/see-all/*"
  to = "/catalog"
  status = 301
  force = true

[[redirects]]
  from = "/sitemap.xml"
  to = "https://api.kudumart.com/api/sitemap.xml"
  status = 200
  force = true

[[redirects]]
  from = "/feed/google-merchant.xml"
  to = "https://api.kudumart.com/api/feed/google-merchant.xml"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
